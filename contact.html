<!DOCTYPE html>

<html>

<head>
    
    <title>Contact Me</title>

    <link rel="stylesheet" href="style.css">

 <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

</head>

<body>

<section class="profile-info">

        <h1>Contact Me</h1>

    <nav class="navigation">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="about.html">About Me</a>
        <a class="nav-link" href="hobbies.html">Hobbies</a>
        <a class="nav-link" href="favorites.html">Favorites</a>
        <a class="nav-link" href="goals.html">Goals</a>
        <a class="nav-link" href="contact.html">Contact Me</a>
    </nav>

    <hr>

    <p><b>Please fill out the form below to contact me:</b></p>

    <form id="f" class="contact-form" onsubmit="sendEmail(event)">

        <label class="form-label">Name:</label><br>
        <input type="text" name="name" required>

        <br><br>

        <label class="form-label">Email Address:</label><br>
        <input type="email" name="email" required>
    
        <br><br>

        <label class="form-label">Gender:</label><br>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female

        <br><br>

        <label class="form-label">Class Strand:</label>

        <select class="form-control" name="class strand">
            <option>ICT</option>
            <option>ABM</option>
            <option>STEM</option>
            <option>HUMMS</option>
            <option>GAS</option>
        </select>

        <br><br>

        <label class="form-label">Message:</label><br>

        <textarea name="message" rows="7" cols="50" required></textarea>

        <p id="s"></p>

        <input type="hidden" name="title" value="Contact Me Form">
        <input type="hidden" id="t" name="time">

        <input class="btn primary" type="submit" value="Send Message">
        <input class="btn primary" type="reset" value="Clear Form">

        <br><br>

    <script>
     emailjs.init({publicKey:"Hw1dsddHp0OKp_m86"});

        sendEmail = e => (
                e.preventDefault(),
                t.value = Date(),
                emailjs.sendForm("service_zpzp7km","template_hcepzrc",f)
                .then(() => {
                    s.innerHTML = "<font color=green>Successfully Sent!</font>";
                    f.reset();
                })
                .catch(() => {
                    s.innerHTML = "<font color=red>Failed!</font>";
                })
            );
    </script>

</form>

</section>

</body>

</html>
